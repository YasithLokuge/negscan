name: release

# Tag a commit to publish a release:
#     git tag v0.1.0 && git push origin v0.1.0
# Or run it from the Actions tab: that builds the installers, and publishes them too if you tick
# "publish", which tags the commit it ran on. Note that re-running an earlier manual run keeps
# that run's original trigger, so it stays a branch run however it is restarted.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0"
        default: "0.0.0-dev"
      publish:
        description: "Publish a GitHub release (tags this commit)"
        type: boolean
        default: false

permissions:
  contents: read

# Only the repository owner can run these. Pushing and workflow_dispatch already need write
# access, but on a public repo anyone can open a pull request, and that would otherwise start a
# build on every runner. Gating on the owner means a stranger's PR creates a run whose jobs all
# skip. Checked against github.repository_owner rather than a hard-coded name so this survives a
# rename or a transfer.

jobs:
  build:
    name: ${{ matrix.label }}
    if: github.actor == github.repository_owner
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every plain macos-* label is Apple Silicon now; macos-15-intel is the one x86_64 image
          # GitHub still offers, and the last it plans to (support ends August 2027). macos-13 was
          # retired, and a job asking for it just queues until it is cancelled rather than failing.
          # PyInstaller cannot cross-build, so each architecture needs its own runner.
          - os: macos-15-intel
            label: macOS (Intel)
          - os: macos-15
            label: macOS (Apple Silicon)
          - os: windows-latest
            label: Windows
          # Built on the oldest supported Ubuntu on purpose: glibc is backward compatible, not
          # forward, so a binary built on a newer release will not start on an older distro.
          - os: ubuntu-22.04
            label: Linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version:-0.0.0}"

      - name: Install Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Build
        run: python packaging/build.py --version ${{ steps.version.outputs.version }}

      - name: Check the frozen app starts
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            macOS)   app="dist/Negscan.app/Contents/MacOS/Negscan" ;;
            Windows) app="dist/Negscan/Negscan.exe" ;;
            *)       app="dist/Negscan/Negscan" ;;
          esac
          # Exits non-zero because no scanner is attached to a runner; what matters is that it
          # loads Qt, finds its bundled libusb, and prints its report rather than crashing.
          output=$("$app" --check 2>&1 || true)
          echo "$output"
          if ! echo "$output" | grep -q "libusb"; then
            echo "::error::--check printed no libusb line; the frozen app did not start properly"
            exit 1
          fi
          if echo "$output" | grep -q "not bundled"; then
            echo "::error::libusb was not bundled into the app"
            exit 1
          fi
          echo "frozen app starts and carries its own libusb"

      # A skipped Publish job gives no hint why, so say here whether one is coming.
      - name: Summarise
        if: always()
        shell: bash
        env:
          WILL_PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo ""
            if [ -d dist/release ] && [ -n "$(ls -A dist/release 2>/dev/null)" ]; then
              for file in dist/release/*; do
                echo "- \`$(basename "$file")\`"
              done
            else
              echo "No installer was produced."
            fi
            echo ""
            echo "Trigger: \`${{ github.event_name }}\` on ${{ github.ref_type }} \`${{ github.ref_name }}\`."
            if [ "$WILL_PUBLISH" = "true" ]; then
              echo "A GitHub release **will be published** once every build succeeds."
            else
              echo "**No release will be published.** Download the files above from this run's"
              echo "Artifacts section, or publish by pushing a tag:"
              echo '```'
              echo "git tag v1.2.3 && git push origin v1.2.3"
              echo '```'
              echo "Re-running this run will not change that: a re-run keeps the original trigger."
              echo "To publish without tagging locally, start a fresh run from the Actions tab and"
              echo "tick **publish**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: negscan-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish
    needs: build
    # A tag push publishes automatically; a manual run only when asked. The owner clause is the
    # same gate as on the build job.
    if: >-
      (github.ref_type == 'tag' || inputs.publish)
      && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # only this job needs to write, and only to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the tag that triggered the run; a manual run tags the commit it
          # ran on with the version that was built.
          tag_name: >-
            ${{ github.ref_type == 'tag' && github.ref_name
                || format('v{0}', needs.build.outputs.version) }}
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            ## Installing

            | Platform | Download | Notes |
            | --- | --- | --- |
            | macOS (Intel) | `*-macOS-x86_64.dmg` | Open the disc image and drag Negscan to Applications |
            | macOS (Apple Silicon) | `*-macOS-arm64.dmg` | As above |
            | Windows | `*-setup.exe`, or the portable `.zip` | Also needs a WinUSB driver — see below |
            | Linux | `*-linux-x86_64.tar.gz` | Unpack, then `sudo ./install.sh` |

            These builds are **not code-signed**.

            - **macOS** will refuse to open it on the first try. Right-click the app and choose
              *Open*, then confirm — or run
              `xattr -dr com.apple.quarantine /Applications/Negscan.app`.
            - **Windows** SmartScreen will warn: *More info* → *Run anyway*. The scanner also needs
              a WinUSB driver bound to it with [Zadig](https://zadig.akeo.ie/) before the app can
              talk to it.
            - **Linux** needs the udev rule from `install.sh` to use the scanner without root.

            Run `Negscan --check` from a terminal if it cannot find the scanner; it reports what
            the app can and cannot see.
